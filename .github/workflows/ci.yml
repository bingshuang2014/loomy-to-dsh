name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Syntax check
        run: |
          for f in *.js; do
            node --check "$f" || exit 1
          done
          echo "All files passed syntax check"

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for console.log
        run: |
          if grep -rn "console\.log" *.js; then
            echo "::warning::Found console.log statements in production code"
          else
            echo "No console.log found in source files"
          fi

      - name: Check for hardcoded paths
        run: |
          if grep -rn "C:\\\\Users\\|D:\\\\" *.js | grep -v "^\s*\*"; then
            echo "::warning::Possible hardcoded Windows paths found"
          else
            echo "No hardcoded paths detected"
          fi
